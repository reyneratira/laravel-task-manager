$kind: http-request
url: "{{base_url}}/tasks/1"
method: DELETE
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Deleted', () => {
          pm.expect(pm.response.json().message).to.include('dihapus');
      });
    language: text/javascript
order: 5000
